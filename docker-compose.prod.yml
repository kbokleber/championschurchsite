version: '3.8'

services:
  backend:
    image: championschurch/backend:latest
    environment:
      - DJANGO_ENVIRONMENT=production
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    networks:
      - postgres_network
      - app_network
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    image: championschurch/frontend:latest
    networks:
      - nginx_network
      - app_network
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  app_network:
    driver: overlay
    attachable: true
  nginx_network:
    external: true
    name: ${NGINX_NETWORK_NAME:-nginx_network}
  postgres_network:
    external: true
    name: ${POSTGRES_NETWORK_NAME:-postgres_network}

volumes:
  media_data:
    driver: local
  static_data:
    driver: local
