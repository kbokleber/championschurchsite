version: '3.8'

services:
  # Backend Django com Gunicorn
  backend:
    image: championschurch/backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # Ambiente
      - DJANGO_ENVIRONMENT=production
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-championschurch.com.br,www.championschurch.com.br}
      
      # PostgreSQL - Conectar ao banco externo
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-championschurch}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      
      # CORS
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://championschurch.com.br,https://www.championschurch.com.br}
    
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    
    networks:
      - postgres_network  # Rede externa do PostgreSQL
      - app_network       # Rede interna da aplicação
    
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React com Nginx
  frontend:
    image: championschurch/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    
    networks:
      - nginx_network  # Rede externa do Nginx
      - app_network    # Rede interna da aplicação
    
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  # Rede interna da aplicação (comunicação frontend <-> backend)
  app_network:
    driver: overlay
    attachable: true
  
  # Rede externa do Nginx (já existente)
  nginx_network:
    external: true
    name: ${NGINX_NETWORK_NAME:-nginx_network}
  
  # Rede externa do PostgreSQL (já existente)
  postgres_network:
    external: true
    name: ${POSTGRES_NETWORK_NAME:-postgres_network}

volumes:
  media_data:
    driver: local
  static_data:
    driver: local
