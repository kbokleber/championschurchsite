server {
    listen 80;
    server_name _;
    
    # Compressão gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
    
    # Root do frontend
    root /usr/share/nginx/html;
    index index.html;
    
    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Proxy para API backend
    # IMPORTANTE: envsubst substitui ${BACKEND_URL} antes do Nginx iniciar
    # Quando proxy_pass não termina com /, o Nginx preserva o path completo
    # Requisição /api/configuracao/ vai para ${BACKEND_URL}/api/configuracao/
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # Usar o host do backend ao invés do frontend
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
    
    # Proxy para admin Django
    location /admin/ {
        proxy_pass ${BACKEND_URL}/admin/;
        proxy_http_version 1.1;
        # Usar o host do backend ao invés do frontend
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Proxy para arquivos de mídia
    location /media/ {
        proxy_pass ${BACKEND_URL}/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    
    # Proxy para arquivos estáticos do Django
    location /static/ {
        proxy_pass ${BACKEND_URL}/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    
    # SPA - Redirecionar todas as outras rotas para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
